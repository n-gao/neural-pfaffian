name: Test

on:
  push:
    branches-ignore:
      - 'excited-states'
  pull_request:

jobs:
  # Run CLI test and pytest
  test:
    runs-on: ubuntu-latest
    steps:
      # Checkout the code (lfs: true fetches the .npz regression fixtures)
      - uses: actions/checkout@v4
        with:
          lfs: true
      # Install uv
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.4.30"
          enable-cache: true
      - name: Create virtual environment
        run: uv sync
      - name: pytest
        run: uv run pytest
